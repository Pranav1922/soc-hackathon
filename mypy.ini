[mypy]
python_version = 3.11

# scikit-learn ships no py.typed marker / stubs, so its submodules are untyped.
# Ignore missing imports ONLY for sklearn.* — all project code stays fully checked.
[mypy-sklearn.*]
ignore_missing_imports = True

# Optional LLM provider SDKs: ollama is not installed and google-generativeai ships
# no py.typed marker. They are lazy-imported in app/llm/client.py; ignore only these.
[mypy-ollama.*]
ignore_missing_imports = True

[mypy-google,google.*]
ignore_missing_imports = True
